<div class="list-group-item playlist-picker-item">
    <label class="playlist-picker-choice" for="someSwitchOptionDefault{randId}">
        <input id="someSwitchOptionDefault{randId}" name="someSwitchOption{response_id}"
            class="playListsVideosIds{videos_id} playListsIds_{id}_videos_id_{videos_id} playListsIds{id}"
            type="checkbox" value="{id}" {checked}>
        <i class="{icon}" aria-hidden="true"></i>
        <span class="nameSearch">{name_translated}</span>
    </label>
    <div class="playlist-picker-actions">
        <button type="button" class="btn btn-xs btn-default" title="{edit_label}" aria-label="{edit_label}"
            onclick="avideoModalIframeFull(webSiteRootURL+'viewProgram/{id}/pl');return false;">
            <i class="fas fa-edit" aria-hidden="true"></i>
        </button>
        <button type="button" class="btn btn-xs btn-default" title="{play_label}" aria-label="{play_label}"
            onclick="avideoModalIframeFull(webSiteRootURL+'plugin/PlayLists/embed.php?playlists_id={id}');return false;">
            <i class="fas fa-play" aria-hidden="true"></i>
        </button>
    </div>
</div>
