name: Docker Manual Build

on:
  workflow_dispatch:
    inputs:
      push:
        description: "Push image to DockerHub"
        required: false
        type: boolean
        default: true
      tag:
        description: "Image tag to build/push"
        required: false
        type: string
        default: "avideo:manual"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Login to DockerHub
        if: ${{ inputs.push }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          push: ${{ inputs.push }}
          tags: ${{ inputs.tag || secrets.DOCKERHUB_IMAGE || 'avideo:1' }}
          context: .
          file: ./Dockerfile.avideo
